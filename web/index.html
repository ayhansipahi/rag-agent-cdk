<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RAG Assistant</title>
  <style>
    :root {
      --bg: #0b0f17;
      --panel: #131a26;
      --border: #1f2937;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #93c5fd;
      --user: #1e293b;
      --bot: #0f172a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; }
    header .status { color: var(--muted); font-size: 12px; }
    main {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
    }
    .msg { margin-bottom: 16px; padding: 12px 16px; border-radius: 8px; line-height: 1.5; }
    .msg.user { background: var(--user); }
    .msg.bot { background: var(--bot); border: 1px solid var(--border); }
    .msg .role { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
    .citations { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); font-size: 12px; color: var(--muted); }
    .citations details { margin-top: 4px; }
    .citations summary { cursor: pointer; }
    .citations code { color: var(--accent); margin-right: 6px; }
    .citations .cite { margin-top: 4px; }
    footer {
      border-top: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      justify-content: center;
    }
    form { display: flex; gap: 8px; max-width: 760px; width: 100%; }
    textarea {
      flex: 1;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
      resize: none;
      min-height: 44px;
      max-height: 200px;
    }
    button {
      background: var(--accent);
      color: #0b0f17;
      border: 0;
      border-radius: 8px;
      padding: 0 16px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .typing { color: var(--muted); font-style: italic; }
  </style>
</head>
<body>
  <header>
    <h1>RAG Assistant</h1>
    <span class="status" id="status">ready</span>
  </header>
  <main id="log"></main>
  <footer>
    <form id="form">
      <textarea id="input" placeholder="Ask a question about the knowledge base..." rows="1"></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </footer>
  <script>
    const log = document.getElementById('log');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const status = document.getElementById('status');
    let sessionId = null;

    const renderCitations = (citations) => {
      const wrap = document.createElement('div');
      wrap.className = 'citations';
      const det = document.createElement('details');
      const sum = document.createElement('summary');
      sum.textContent = citations.length + ' citation(s)';
      det.appendChild(sum);
      citations.forEach((cit) => {
        const row = document.createElement('div');
        row.className = 'cite';
        const src = document.createElement('code');
        src.textContent = cit.source || '?';
        const sep = document.createTextNode(' — ');
        const quote = document.createTextNode(cit.quote || '');
        row.append(src, sep, quote);
        det.appendChild(row);
      });
      wrap.appendChild(det);
      return wrap;
    };

    const append = (role, text, citations) => {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      const head = document.createElement('div');
      head.className = 'role';
      head.textContent = role === 'user' ? 'You' : 'Assistant';
      const body = document.createElement('div');
      body.textContent = text;
      div.append(head, body);
      if (citations && citations.length) {
        div.appendChild(renderCitations(citations));
      }
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return { body, container: div };
    };

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      append('user', text);
      input.value = '';
      sendBtn.disabled = true;
      status.textContent = 'thinking…';
      const placeholder = append('bot', '…');
      placeholder.body.classList.add('typing');
      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ message: text, sessionId }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'request failed');
        sessionId = data.sessionId || sessionId;
        placeholder.body.classList.remove('typing');
        placeholder.body.textContent = data.answer || '(no answer)';
        if (data.citations && data.citations.length) {
          placeholder.container.appendChild(renderCitations(data.citations));
        }
      } catch (err) {
        placeholder.body.classList.remove('typing');
        placeholder.body.textContent = 'Error: ' + err.message;
      } finally {
        sendBtn.disabled = false;
        status.textContent = 'ready';
      }
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });
  </script>
</body>
</html>
